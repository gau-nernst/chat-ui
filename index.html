<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat UI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
<link rel="stylesheet" id="hljs-light" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" integrity="sha384-eFTL69TLRZTkNfYZOLM+G04821K1qZao/4QLJbet1pP4tcF+fdXq/9CdqAbWRl/L" crossorigin="anonymous">
<link rel="stylesheet" id="hljs-dark" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH" crossorigin="anonymous" disabled>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous"></script>
<style>
:root {
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --bg: #ffffff; --side: #f8f8f7; --surface: #f3f3f1; --hover: #ebebe8; --fg: #1d1d1b; --muted: #6e6d68; --faint: #a3a29c;
  --border: #e6e5e1; --user: #f1f0ec; --link: #2f6feb; --ring: rgb(47 111 235 / .35);
  --err: #b42318; --err-bg: #fef3f2; --err-border: #fecdca;
  --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 4px 16px rgb(0 0 0 / .06);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1b1b1a; --side: #151514; --surface: #252523; --hover: #2e2e2c; --fg: #ececea; --muted: #a09f99; --faint: #6c6b66;
  --border: #31312e; --user: #2a2a28; --link: #7aa7ff; --ring: rgb(122 167 255 / .35);
  --err: #fda29b; --err-bg: #2b1b1a; --err-border: #55302c;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); display: flex;
  font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
code, pre { font-family: var(--mono); font-size: 13px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
* { scrollbar-width: thin; scrollbar-color: var(--hover) transparent; }

.ibtn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; color: var(--muted); }
.ibtn:hover:not(:disabled) { background: var(--hover); color: var(--fg); }
.ibtn.sm { width: 28px; height: 28px; border-radius: 6px; }
.ibtn.sm svg.i { width: 15px; height: 15px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; font-weight: 500; font-size: 14px; border: 1px solid var(--border); background: var(--bg); }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.primary:hover:not(:disabled) { background: var(--fg); opacity: .88; }


/* main */
main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
#top { display: flex; align-items: center; gap: 4px; padding: 10px 12px; }
#top .grow { flex: 1; }

#banner { display: none; margin: 4px auto 0; max-width: 760px; width: calc(100% - 32px); padding: 12px 40px 12px 16px; border-radius: 12px; background: var(--err-bg); color: var(--err); border: 1px solid var(--err-border); position: relative; font-size: 14px; }
#banner.show { display: block; }
#banner .ibtn { position: absolute; top: 6px; right: 6px; color: inherit; }
#banner .md code { background: rgb(0 0 0 / .06); }
#banner .md a { color: inherit; }

#log { flex: 1; overflow-y: auto; padding: 24px 20px 8px; }
#log .inner { max-width: 760px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.empty { margin: auto; text-align: center; padding-bottom: 8vh; }
.empty h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 6px; }
.empty p { margin: 0; color: var(--muted); font-size: 14px; }

/* messages */
.msg { margin-bottom: 28px; }
.msg.user { display: flex; flex-direction: column; align-items: flex-end; }
.msg.user .body { background: var(--user); border-radius: 18px; padding: 10px 16px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .imgs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin-bottom: 6px; }
.msg .imgs img { max-height: 180px; max-width: 100%; border-radius: 12px; display: block; }
.msg.user .imgs + .body:empty { display: none; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin-top: 4px; opacity: 0; transition: opacity .12s; min-height: 28px; }
.msg:hover .actions, .msg:last-child .actions, .msg:focus-within .actions { opacity: 1; }
@media (hover: none) { .actions { opacity: 1; } }
.msg.user .actions { justify-content: flex-end; }
.stats { font-size: 12px; color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
.md { overflow-wrap: anywhere; line-height: 1.7; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol { margin: 0 0 .9em; }
.md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.4em 0 .6em; font-weight: 600; }
.md h1 { font-size: 1.4em; } .md h2 { font-size: 1.25em; } .md h3 { font-size: 1.1em; }
.md li { margin: .25em 0; }
.md hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }
.md :not(pre) > code { background: var(--surface); border: 1px solid var(--border); padding: 1px 5px; border-radius: 5px; font-size: .86em; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; margin: 0 0 1em; font-size: 14px; }
.md th, .md td { border-bottom: 1px solid var(--border); padding: 6px 12px; text-align: left; }
.md th { font-weight: 600; }
.md blockquote { margin: 0 0 1em; padding-left: 14px; border-left: 3px solid var(--border); color: var(--muted); }
.md img { max-width: 100%; }
.md a { color: var(--link); text-decoration: none; }
.md a:hover { text-decoration: underline; }
.code { border: 1px solid var(--border); border-radius: 10px; margin: 0 0 1em; overflow: hidden; background: var(--side); }
.code .bar { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 2px 12px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.code .bar .ibtn { width: auto; padding: 0 8px; gap: 5px; display: inline-flex; font-size: 12px; }
.code pre { margin: 0; padding: 12px 14px; overflow-x: auto; line-height: 1.55; }
.code pre code.hljs { background: none; padding: 0; }

.tools:not(:empty) { display: flex; flex-direction: column; gap: 6px; margin: 2px 0 10px; }
details.tool { border: 1px solid var(--border); border-radius: 10px; background: var(--side); font-size: 13.5px; }
details.tool summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; color: var(--muted); user-select: none; }
details.tool summary::-webkit-details-marker { display: none; }
details.tool summary:hover { color: var(--fg); }
details.tool summary svg.i { width: 15px; height: 15px; }
details.tool summary svg.i:last-child { transition: transform .15s; }
details.tool[open] summary svg.i:last-child { transform: rotate(90deg); }
details.tool summary b { font: 500 12.5px var(--mono); color: var(--fg); }
details.tool summary .arg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.tool summary em { font-style: normal; font-size: 12.5px; }
details.tool.bad summary em { color: var(--err); }
details.tool .tbody { border-top: 1px solid var(--border); padding: 4px 12px 12px; }
details.tool .tlabel { font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 4px; }
details.tool pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow-y: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.5; }
details.think { margin-bottom: 14px; }
details.think summary { list-style: none; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; font-size: 13.5px; color: var(--muted); padding: 3px 8px 3px 4px; margin-left: -4px; border-radius: 6px; }
details.think summary::-webkit-details-marker { display: none; }
details.think summary:hover { color: var(--fg); background: var(--hover); }
details.think summary svg.i { width: 15px; height: 15px; transition: transform .15s; }
details.think[open] summary svg.i { transform: rotate(90deg); }
details.think .md { font-size: 14px; color: var(--muted); border-left: 2px solid var(--border); padding: 2px 0 2px 14px; margin: 8px 0 0 4px; }
.thinking { background: linear-gradient(90deg, var(--muted) 30%, var(--faint) 50%, var(--muted) 70%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.6s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.err { color: var(--err); background: var(--err-bg); border: 1px solid var(--err-border); border-radius: 12px; padding: 10px 14px; margin-top: 8px; font-size: 14px; }
.err code { background: rgb(0 0 0 / .06); }
.err a { color: inherit; }
.cursor > :last-child::after, .cursor:empty::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 4px; border-radius: 50%; background: var(--fg); vertical-align: middle; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.editbox { width: 100%; background: var(--user); border-radius: 18px; padding: 10px 12px; }
.editbox textarea { width: 100%; min-height: 72px; resize: vertical; background: none; border: none; outline: none; }
.editbox div { display: flex; gap: 8px; justify-content: flex-end; }

/* composer */
#composer { padding: 0 20px 20px; position: relative; }
#composer .box { max-width: 760px; margin: 0 auto; border: 1px solid var(--border); border-radius: 22px; background: var(--bg); box-shadow: var(--shadow); padding: 10px 10px 8px 14px; }
:root[data-theme="dark"] #composer .box { background: var(--surface); }
#composer .box:focus-within { border-color: var(--faint); }
#atts { display: flex; flex-wrap: wrap; gap: 8px; }
#atts:not(:empty) { margin: 2px 0 8px; }
#atts .att { position: relative; }
#atts img { height: 60px; width: 60px; object-fit: cover; border-radius: 10px; display: block; border: 1px solid var(--border); }
#atts button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
#atts button svg.i { width: 12px; height: 12px; stroke-width: 2.5; }
#input { width: 100%; border: none; background: none; resize: none; outline: none; max-height: 40vh; padding: 4px 0; display: block; }
#input::placeholder { color: var(--faint); }
#composer .row { display: flex; align-items: center; margin-top: 4px; }
#composer .row .grow { flex: 1; }
#attach { margin-left: -6px; }
#ctxRing { position: relative; display: inline-grid; place-items: center; width: 30px; height: 30px; color: var(--muted); cursor: default; border-radius: 8px; }
#ctxRing[hidden] { display: none; }
#ctxRing > svg { width: 18px; height: 18px; transform: rotate(-90deg); }
.tip { display: none; position: absolute; bottom: calc(100% + 10px); right: -70px; z-index: 20; width: 240px; padding: 10px 12px; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 28px rgb(0 0 0 / .14); font-size: 12.5px; line-height: 1.5; font-variant-numeric: tabular-nums; }
:root[data-theme="dark"] .tip { background: var(--surface); }
#ctxRing:hover .tip, #ctxRing:focus-visible .tip { display: block; }
.tip .tt { font-weight: 600; }
.tip .tt small { font-weight: 400; color: var(--faint); font-size: 12px; }
.tip .bar { position: relative; height: 6px; border-radius: 3px; background: var(--border); margin: 8px 0 6px; }
.tip .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--muted); }
#ctxRing.warn .tip .bar i { background: #d97706; }
#ctxRing.bad .tip .bar i { background: var(--err); }
.tip .bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 1px; background: var(--fg); opacity: .45; }
.tip .tl { display: flex; justify-content: space-between; }
.tip .ts { color: var(--muted); }
#ctxRing circle { fill: none; stroke-width: 2.6; }
#ctxRing .track { stroke: var(--border); }
#ctxRing .fill { stroke: currentColor; stroke-linecap: round; stroke-dasharray: 50.27; transition: stroke-dashoffset .3s; }
#ctxRing.warn { color: #d97706; }
#ctxRing.bad { color: var(--err); }
#send { width: 34px; height: 34px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
#send:disabled { opacity: .25; }
#send svg.i { stroke-width: 2.2; }

#jump { position: absolute; top: -46px; left: 50%; translate: -50%; width: 34px; height: 34px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); box-shadow: var(--shadow); color: var(--fg); }
#jump[hidden] { display: none; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); padding: 6px 10px; }
.btn.ghost:hover:not(:disabled) { background: var(--hover); color: var(--fg); }
.btn.ghost svg.i { width: 16px; height: 16px; }
.step + .step { margin-top: 12px; }

/* composer menus */
.popwrap { position: relative; }
.pop { position: absolute; bottom: calc(100% + 10px); z-index: 20; width: 290px; max-width: calc(100vw - 32px); max-height: 60vh; overflow-y: auto; padding: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 28px rgb(0 0 0 / .14); }
:root[data-theme="dark"] .pop { background: var(--surface); }
.pop[hidden] { display: none; }
.pop.right { right: -44px; }
.mi { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 8px; font-size: 13.5px; text-align: left; cursor: pointer; }
.mi:hover { background: var(--hover); }
.mi > svg.i { width: 16px; height: 16px; color: var(--muted); }
.mi > span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mi small { color: var(--faint); font-size: 12px; line-height: 1.35; }
.mi.on { font-weight: 500; }
.mi.on > svg.i:last-child { color: var(--link); }
.mi .mono { font: 500 12.5px var(--mono); }
.ph { padding: 6px 10px 4px; font-size: 11.5px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
.sep { height: 1px; background: var(--border); margin: 6px 4px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 15px; font-size: 13px; font-weight: 500; color: var(--muted); }
.toggle svg.i { width: 15px; height: 15px; }
.toggle:hover { background: var(--hover); color: var(--fg); }
.toggle[aria-pressed="true"] { color: var(--link); background: color-mix(in srgb, var(--link) 13%, transparent); }
.ehead { display: flex; align-items: baseline; justify-content: space-between; padding-right: 10px; }
#effortVal { font-size: 13px; font-weight: 500; }
#effortVal small { color: var(--faint); font-weight: 400; }
#effortRange { width: calc(100% - 20px); margin: 6px 10px 2px; accent-color: var(--link); cursor: pointer; }
#effortTicks { display: flex; justify-content: space-between; padding: 0 10px 6px; font-size: 11px; color: var(--faint); }
#effortTicks span { width: 0; display: flex; justify-content: center; white-space: nowrap; }
#effortTicks span:first-child { justify-content: flex-start; }
#effortTicks span:last-child { justify-content: flex-end; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 16px; font-size: 13px; font-weight: 500; color: var(--muted); min-width: 0; }
.chip:hover, .chip[aria-expanded="true"] { background: var(--hover); color: var(--fg); }
.chip svg.i { width: 15px; height: 15px; flex-shrink: 0; }
.chip[hidden] { display: none; }
#modelChip { max-width: 44vw; }
#modelChip .mname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#modelChip .meff { color: var(--faint); white-space: nowrap; }
#modelChip .meff:not(:empty)::before { content: "· "; }
main.is-empty #log, main.is-empty #composer { flex: 1 1 0; }
main.is-empty #log .inner { justify-content: flex-end; }
main.is-empty .empty { margin: 0 auto 28px; padding: 0; }

/* settings panel */
#panel { width: 340px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--side); display: none; flex-direction: column; }
body.panel-open #panel { display: flex; }
#panel .head { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px 0 20px; min-height: 54px; }
#panel h2 { margin: 0; font-size: 15px; font-weight: 600; }
#panel .scroll { flex: 1; overflow-y: auto; padding: 0 20px 24px; }
#panel h3 { margin: 18px 0 10px; font-size: 11.5px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
#panel .field { display: block; margin-bottom: 12px; font-size: 13px; font-weight: 500; }
#panel .field input, #panel .field textarea { display: block; width: 100%; margin-top: 5px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13.5px; font-weight: 400; outline: none; }
#panel .field input:focus, #panel .field textarea:focus { border-color: var(--link); box-shadow: 0 0 0 3px var(--ring); }
#panel .field textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
#panel ::placeholder { color: var(--faint); }
#panel .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
#panel input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--link); flex-shrink: 0; }
#panel .master { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; margin-bottom: 8px; cursor: pointer; }
.status { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); margin: -4px 0 4px; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.status.ok::before { background: #22a55b; }
.status.bad::before { background: var(--err); }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); }
.seg button { flex: 1; padding: 5px 0; border-radius: 6px; font-size: 13px; color: var(--muted); }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--hover); color: var(--fg); font-weight: 500; }
#toolList { border: 1px solid var(--border); border-radius: 10px; background: var(--bg); margin-bottom: 12px; }
.trow { padding: 9px 12px; }
.trow + .trow { border-top: 1px solid var(--border); }
.trow label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.trow .tname { font: 500 12.5px var(--mono); }
.trow .tsum { font-size: 12.5px; color: var(--muted); margin: 2px 0 0 24px; line-height: 1.45; }
.trow details { margin: 4px 0 0 24px; }
#toolList.disabled { opacity: .5; }
.trow summary { font-size: 12px; color: var(--faint); cursor: pointer; width: fit-content; }
.trow summary:hover { color: var(--fg); }
.trow pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11.5px; line-height: 1.45; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px; max-height: 280px; overflow-y: auto; margin: 6px 0 0; }

.msg .imgs img, #atts img, .md img { cursor: zoom-in; }
#drop { display: none; position: absolute; inset: 10px; z-index: 5; place-items: center; align-content: center; gap: 10px; border: 2px dashed var(--faint); border-radius: 18px; background: color-mix(in srgb, var(--bg) 88%, transparent); color: var(--muted); font-weight: 500; pointer-events: none; }
#drop svg.i { width: 32px; height: 32px; }
body.dragging #drop { display: grid; }
#viewer { width: fit-content; height: fit-content; margin: auto; max-width: none; max-height: none; overflow: hidden; padding: 0; background: none; border: none; box-shadow: none; outline: none; cursor: zoom-out; }
#viewer::backdrop { background: rgb(0 0 0 / .85); }
#viewer img { display: block; max-width: 94vw; max-height: 92vh; border-radius: 8px; }

@media (max-width: 760px) {
  #log { padding: 16px 16px 8px; }
  #composer { padding: 0 12px 12px; }
  body.panel-open #panel { position: fixed; z-index: 30; top: 0; right: 0; bottom: 0; width: min(100vw, 380px); box-shadow: -8px 0 32px rgb(0 0 0 / .25); }
}
</style>
</head>
<body>
<main>
  <div id="top">
    <span class="grow"></span>
    <button class="btn ghost" id="new" title="Clear the chat (chats aren't saved)"><i data-icon="eraser"></i>Clear</button>
    <button class="ibtn" id="openSettings" title="Settings" aria-label="Settings"><i data-icon="sliders"></i></button>
  </div>
  <div id="drop"><i data-icon="image"></i>Drop images to attach</div>
  <div id="banner"><button class="ibtn sm" id="bannerClose" aria-label="Dismiss"><i data-icon="x"></i></button><div class="md"></div></div>
  <div id="log"><div class="inner"></div></div>
  <div id="composer">
    <button class="ibtn" id="jump" title="Jump to latest" aria-label="Jump to latest" hidden><i data-icon="down"></i></button>
    <div class="box">
      <div id="atts"></div>
      <textarea id="input" rows="1" placeholder="Message"></textarea>
      <div class="row">
        <button class="ibtn" id="attach" title="Attach images (or paste / drop)" aria-label="Attach images"><i data-icon="clip"></i></button>
        <input type="file" id="file" accept="image/*" multiple hidden>
        <button class="toggle" id="toolsBtn" aria-pressed="false"><i data-icon="wrench"></i><span>Tools</span></button>
        <span class="grow"></span>
        <span id="ctxRing" tabindex="0" role="img" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><circle class="track" cx="10" cy="10" r="8"/><circle class="fill" cx="10" cy="10" r="8"/></svg><div class="tip" aria-hidden="true"></div></span>
        <div class="popwrap">
          <button class="chip" id="modelChip" aria-haspopup="true" aria-expanded="false"><span class="mname"></span><span class="meff"></span><i data-icon="down"></i></button>
          <div class="pop right" id="modelMenu" hidden>
            <div class="ph">Model</div><div id="modelList"></div>
            <div id="effortBox" hidden>
              <div class="sep"></div>
              <div class="ehead"><span class="ph">Thinking</span><span id="effortVal"></span></div>
              <input type="range" id="effortRange" min="0" step="1" aria-label="Thinking effort">
              <div id="effortTicks"></div>
            </div>
          </div>
        </div>
        <button id="send" title="Send" aria-label="Send"></button>
      </div>
    </div>
  </div>
</main>

<aside id="panel" aria-label="Settings">
  <div class="head"><h2>Settings</h2><button class="ibtn sm" id="closePanel" title="Close" aria-label="Close settings"><i data-icon="x"></i></button></div>
  <div class="scroll">
    <h3>Connection</h3>
    <label class="field">Base URL <input data-key="baseUrl" placeholder="http://localhost:8000/v1" autocomplete="off" spellcheck="false"></label>
    <label class="field">API key <input data-key="apiKey" type="password" placeholder="none" autocomplete="off"></label>
    <div class="status" id="connStatus">Not connected</div>
    <h3>Generation</h3>
    <label class="field">System prompt <textarea data-key="system" rows="5" placeholder="Empty = no system message is sent (the chat template's default applies)"></textarea></label>
    <div class="grid">
      <label class="field">Temperature <input data-key="temperature" inputmode="decimal" placeholder="default"></label>
      <label class="field">Top-p <input data-key="top_p" inputmode="decimal" placeholder="default"></label>
      <label class="field">Max tokens <input data-key="max_tokens" inputmode="numeric" placeholder="default"></label>
    </div>
    <h3>Appearance</h3>
    <div class="seg" id="themeSeg"><button data-theme="auto">Auto</button><button data-theme="light">Light</button><button data-theme="dark">Dark</button></div>
    <h3>Tools</h3>
    <label class="master"><input type="checkbox" id="toolsMaster">Let the model use tools</label>
    <label class="field">Stop tools at % of context <input data-key="ctxPct" inputmode="numeric" placeholder="75"></label>
    <div id="toolList"></div>
  </div>
</aside>
<dialog id="viewer" aria-label="Image viewer"><img alt=""></dialog>

<script>
'use strict';
const $ = s => document.querySelector(s);
const defaults = { baseUrl: 'http://localhost:8000/v1', apiKey: '', model: '', system: '', temperature: '', top_p: '', max_tokens: '', efforts: {}, tools: false, toolsOff: [], ctxPct: '', theme: 'auto' };
const settings = { ...defaults }; // in memory only: nothing is stored in the browser, a reload resets everything

// ---------- icons ----------
const ICONS = {
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  right: '<path d="M9 6l6 6-6 6"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 21v-5h5"/>',
  sliders: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  x: '<path d="M18 6L6 18M6 6l12 12"/>',
  clip: '<path d="M21 11.5l-8.5 8.5a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/>',
  up: '<path d="M12 19V5M5 12l7-7 7 7"/>',
  stop: '<rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
  check: '<path d="M5 12l5 5L20 7"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  code: '<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  eraser: '<path d="M7 21l-4.3-4.3a2.4 2.4 0 0 1 0-3.4l9.6-9.6a2.4 2.4 0 0 1 3.4 0l5.6 5.6a2.4 2.4 0 0 1 0 3.4L13 21"/><path d="M22 21H7M5 11l9 9"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>',
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
document.querySelectorAll('i[data-icon]').forEach(el => el.outerHTML = icon(el.dataset.icon));


// ---------- state ----------
let cur = { messages: [] }; // the current chat; kept in memory only, so a reload or Clear discards it
let controller = null; // AbortController of the running request
let attachments = [];  // data URLs pending in the composer

// ---------- theme ----------
const darkMq = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const dark = settings.theme === 'dark' || (settings.theme === 'auto' && darkMq.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('#hljs-dark').disabled = !dark;
  $('#hljs-light').disabled = dark;
  for (const b of $('#themeSeg').children) b.setAttribute('aria-pressed', String(b.dataset.theme === settings.theme));
}
darkMq.addEventListener('change', applyTheme);
$('#themeSeg').onclick = e => {
  const t = e.target.closest('button')?.dataset.theme;
  if (t) { settings.theme = t; applyTheme(); }
};

// ---------- markdown ----------
if (window.DOMPurify) DOMPurify.addHook('afterSanitizeAttributes', n => {
  if (n.tagName === 'A') { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener noreferrer'); }
  // Remote images in model output are never loaded: a prompt-injected page could get the model to emit an image
  // URL that carries chat content to a third party. setMd turns them into links instead.
  if (n.tagName === 'IMG' && !/^(data|blob):/i.test(n.getAttribute('src') || '')) {
    n.setAttribute('data-remote', n.getAttribute('src') || '');
    n.removeAttribute('src');
    n.removeAttribute('srcset');
  }
});
function setMd(el, s) {
  if (!window.marked || !window.DOMPurify) { el.textContent = s; el.style.whiteSpace = 'pre-wrap'; return; }
  el.innerHTML = DOMPurify.sanitize(marked.parse(s));
  el.querySelectorAll('img[data-remote]').forEach(img => {
    const a = document.createElement('a');
    a.href = img.dataset.remote;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = `[image${img.alt ? ': ' + img.alt : ''}]`;
    img.replaceWith(a);
  });
  el.querySelectorAll('pre > code').forEach(c => {
    const pre = c.parentElement, wrap = document.createElement('div');
    wrap.className = 'code';
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.innerHTML = `<span></span><button class="ibtn sm copy-code">${icon('copy')}<span>Copy</span></button>`;
    bar.firstChild.textContent = (c.className.match(/language-(\S+)/) || [])[1] || 'text';
    pre.replaceWith(wrap);
    wrap.append(bar, pre);
    if (window.hljs) hljs.highlightElement(c);
  });
}
function flashCopied(b, text) {
  navigator.clipboard.writeText(text).then(() => {
    const old = b.innerHTML;
    b.innerHTML = b.innerHTML.replace(/<svg[\s\S]*?<\/svg>/, icon('check')).replace('>Copy<', '>Copied<');
    setTimeout(() => b.innerHTML = old, 1200);
  });
}
$('#log').addEventListener('click', e => {
  const b = e.target.closest('.copy-code');
  if (b) flashCopied(b, b.closest('.code').querySelector('code').textContent);
});

// ---------- API ----------
function baseUrl() {
  let u = settings.baseUrl.trim().replace(/\/+$/, '').replace(/\/(chat\/completions|models)$/, '');
  if (u && !/^https?:\/\//i.test(u)) u = 'http://' + u;
  try { if (new URL(u).pathname === '/') u += '/v1'; } catch {}
  return u;
}
const isLoopback = h => h === 'localhost' || h.endsWith('.localhost') || /^127\./.test(h) || h === '[::1]';
const blockedAsMixed = u => location.protocol === 'https:' && u.protocol === 'http:' && !isLoopback(u.hostname);

function networkHint(url) {
  const u = new URL(url), origin = location.origin;
  const tips = [];
  if (blockedAsMixed(u)) tips.push(`**Mixed content:** this page is HTTPS, and browsers block plain-http requests to hosts other than localhost. Put HTTPS in front of the server (e.g. \`tailscale serve 8000\`) and use that https:// URL, or use the UI on the server machine via http://localhost.`);
  tips.push(`Is the server running? Try opening [${baseUrl()}/models](${baseUrl()}/models) in a new tab.`);
  tips.push(`**CORS:** the server must allow origin \`${origin}\` (vLLM: \`--allowed-origins '["${origin}"]'\`; recent vLLM versions allow no origins by default).`);
  tips.push(`**Chrome local network access:** if you blocked the prompt asking to access devices on your local network, re-allow it in site settings (icon left of the address bar), then reload.`);
  return `Could not reach \`${u.origin}\`. Possible causes:\n\n` + tips.map(t => '- ' + t).join('\n');
}

async function apiFetch(path, opts = {}) {
  const url = baseUrl() + path;
  let u; try { u = new URL(url); } catch { throw new Error(`Invalid base URL: \`${settings.baseUrl}\``); }
  const headers = {};
  if (opts.body) headers['Content-Type'] = 'application/json';
  if (settings.apiKey) headers.Authorization = 'Bearer ' + settings.apiKey;
  const init = { ...opts, headers };
  // Chrome's Local Network Access lets HTTPS pages reach http:// LAN hosts when this is set (with user permission).
  if (blockedAsMixed(u)) init.targetAddressSpace = 'local';
  let res;
  try { res = await fetch(url, init); }
  catch (e) { if (e.name === 'AbortError') throw e; throw new Error(networkHint(url)); }
  if (!res.ok) {
    let msg = '';
    try {
      const t = await res.text();
      try { const j = JSON.parse(t); msg = j.error?.message ?? j.message ?? j.detail ?? t; } catch { msg = t; }
      if (typeof msg !== 'string') msg = JSON.stringify(msg);
    } catch {}
    const hint = {
      401: 'Check the API key in Settings (vLLM `--api-key`).',
      404: `Endpoint not found: \`${url}\`. Does the base URL need (or not need) \`/v1\`?`,
    }[res.status] || (/auto-tool-choice|tool-call-parser/i.test(msg) ? 'Tools need vLLM started with `--enable-auto-tool-choice --tool-call-parser <parser>` (Qwen3.x: `qwen3_xml`). Or turn Tools off.' : '');
    throw new Error(`HTTP ${res.status}${msg ? ': ' + msg : ''}${hint ? '\n\n' + hint : ''}`);
  }
  return res;
}

// vLLM exposes prefix-cache and speculative-decoding counters on /metrics (server root, not /v1).
// Diffing them around a request gives per-request numbers, assuming no other requests run concurrently.
const METRICS = {
  hits: 'vllm:prefix_cache_hits_total', queries: 'vllm:prefix_cache_queries_total',
  accepted: 'vllm:spec_decode_num_accepted_tokens_total', draftTokens: 'vllm:spec_decode_num_draft_tokens_total',
  drafts: 'vllm:spec_decode_num_drafts_total',
};
const noMetrics = new Set(); // base URLs where /metrics is unavailable
async function readMetrics() {
  const url = baseUrl().replace(/\/v1$/, '') + '/metrics';
  if (noMetrics.has(url)) return null;
  try {
    const headers = settings.apiKey ? { Authorization: 'Bearer ' + settings.apiKey } : {};
    const res = await fetch(url, { headers, signal: AbortSignal.timeout(2000) });
    if (!res.ok) throw new Error();
    const out = {};
    for (const line of (await res.text()).split('\n')) {
      for (const [k, name] of Object.entries(METRICS)) {
        if (line.startsWith(name + '{') || line.startsWith(name + ' '))
          out[k] = (out[k] || 0) + parseFloat(line.slice(line.lastIndexOf(' ') + 1));
      }
    }
    return out;
  } catch { noMetrics.add(url); return null; }
}

let ctxLen = {}; // model id -> context length (vLLM reports max_model_len; standard OpenAI servers don't)
const ctxFraction = () => Math.min(100, Math.max(10, Number(settings.ctxPct) || 75)) / 100;
const fmtTok = n => n.toLocaleString('en-US');
let models = [];
async function loadModels() {
  try {
    const j = await (await apiFetch('/models')).json();
    const ids = (j.data || []).map(m => m.id);
    ctxLen = Object.fromEntries((j.data || []).map(m => [m.id, m.max_model_len]));
    if (!ids.includes(settings.model)) { settings.model = ids[0] || ''; }
    models = ids;
    setStatus(true, connText());
    hideBanner();
  } catch (e) {
    models = [];
    setStatus(false, 'Not connected');
    showBanner(e.message);
  }
  syncModelChip();
  if (!cur.messages.length) renderLog(); else updateRing();
  if (settings.model) effortsFor(settings.model).then(() => { syncModelChip(); renderEffort(); });
}
function connText() {
  const n = Object.keys(ctxLen).length, max = ctxLen[settings.model];
  return `Connected · ${n} model${n === 1 ? '' : 's'}` + (max ? ` · ${fmtTok(max)}-token context` : '');
}
function setStatus(ok, text) { const el = $('#connStatus'); el.className = 'status ' + (ok ? 'ok' : 'bad'); el.textContent = text; }
let lastFocusLoad = 0;
addEventListener('focus', () => { if (!controller && Date.now() - lastFocusLoad > 3000) { lastFocusLoad = Date.now(); loadModels(); } });

function showBanner(text) { setMd($('#banner .md'), text); $('#banner').classList.add('show'); }
function hideBanner() { $('#banner').classList.remove('show'); }
$('#bannerClose').onclick = hideBanner;

// Reasoning may come as a separate field (vLLM with --reasoning-parser) or inline <think> tags.
function splitThink(m) {
  let r = m.reasoning || '', t = m.text || '';
  const open = t.match(/^\s*<think>/);
  if (open) {
    t = t.slice(open[0].length);
    const k = t.indexOf('</think>');
    if (k < 0) return { r: r + t, t: '' };
    r += t.slice(0, k); t = t.slice(k + 8);
  } else {
    const k = t.indexOf('</think>');
    if (k >= 0) { r += t.slice(0, k); t = t.slice(k + 8); }
  }
  return { r: r.trim(), t: t.replace(/^\s+/, '') };
}

function apiMessages(msgs) {
  const out = [];
  if (settings.system.trim()) out.push({ role: 'system', content: settings.system.trim() }); // empty = no system message
  const lastUser = msgs.findLastIndex(m => m.role === 'user');
  msgs.forEach((m, i) => {
    if (m.role === 'assistant') {
      const { r, t } = splitThink(m);
      const calls = m.toolCalls || [];
      if (!t && !calls.length) return;
      const msg = { role: 'assistant', content: t };
      // Keep reasoning within the current turn so multi-step tool use stays coherent.
      if (i > lastUser && r) msg.reasoning = r;
      if (calls.length) msg.tool_calls = calls.map(c => ({ id: c.id, type: 'function', function: { name: c.name, arguments: c.args || '{}' } }));
      out.push(msg);
      for (const c of calls) out.push({ role: 'tool', tool_call_id: c.id, content: i < lastUser ? '[Omitted: tool result from an earlier turn.]' : c.result ?? 'Error: the tool call was cancelled.' });
    } else if (m.images?.length) {
      out.push({ role: 'user', content: [
        ...m.images.map(url => ({ type: 'image_url', image_url: { url } })),
        ...(m.text ? [{ type: 'text', text: m.text }] : []),
      ] });
    } else out.push({ role: 'user', content: m.text });
  });
  return out;
}

const MAX_ROUNDS = 6; // model calls per answer when tools are on; the last one gets no tools, forcing an answer

async function generate() {
  const conv = cur;
  controller = new AbortController();
  const signal = controller.signal;
  setBusy(true);
  try {
    let lowContext = false;
    for (let round = 1; round <= MAX_ROUNDS; round++) {
      const a = await streamReply(conv, signal, settings.tools && enabledTools().length > 0 && round < MAX_ROUNDS && !lowContext);
      if (!a.toolCalls?.length || a.error || signal.aborted) break;
      await runToolCalls(conv, a, signal);
      if (signal.aborted) break;
      // Past the context threshold, stop offering tools so the model answers instead of overflowing.
      const max = ctxLen[a.model], used = (a.stats?.prompt ?? 0) + (a.stats?.tokens ?? 0);
      lowContext = !!max && used > max * ctxFraction();
    }
  } finally {
    controller = null;
    setBusy(false);
    if (conv === cur) renderLog();
  }
}

// Streams one model reply into a new assistant message.
async function streamReply(conv, signal, withTools) {
  const effort = effortToSend(settings.model);
  const a = { role: 'assistant', text: '', reasoning: '', model: settings.model, effort: effort || undefined };
  conv.messages.push(a);
  if (conv === cur) renderLog();
  const el = conv === cur ? [...$('#log .inner').querySelectorAll('.step')].at(-1) : null;
  const m0 = await readMetrics();
  const t0 = performance.now();
  let tFirst = 0, tAnswer = 0, chunks = 0, usage = null;
  try {
    const body = {
      model: settings.model,
      messages: apiMessages(conv.messages.slice(0, -1)),
      stream: true,
      stream_options: { include_usage: true },
    };
    if (withTools) body.tools = toolSpecs();
    if (effort) body.reasoning_effort = effort;
    for (const k of ['temperature', 'top_p', 'max_tokens']) {
      const v = String(settings[k]).trim();
      if (v !== '') body[k] = Number(v);
    }
    const res = await apiFetch('/chat/completions', { method: 'POST', body: JSON.stringify(body), signal });
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = '';
    read: for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') break read;
        const j = JSON.parse(data);
        if (j.error) throw new Error(j.error.message || JSON.stringify(j.error));
        if (j.usage) usage = j.usage;
        const d = j.choices?.[0]?.delta;
        if (!d) continue;
        const r = d.reasoning ?? d.reasoning_content;
        if (!r && !d.content && !d.tool_calls?.length) continue;
        const now = performance.now();
        tFirst ||= now;
        if (d.content || d.tool_calls?.length) tAnswer ||= now;
        chunks++;
        if (r) a.reasoning += r;
        if (d.content) a.text += d.content;
        for (const tc of d.tool_calls || []) {
          const c = (a.toolCalls ||= [])[tc.index ?? 0] ||= { id: '', name: '', args: '' };
          if (tc.id) c.id = tc.id;
          if (tc.function?.name) c.name += tc.function.name;
          if (tc.function?.arguments) c.args += tc.function.arguments;
        }
        if (el) scheduleUpdate(el, a);
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') a.error = e.message;
  }
  if (a.toolCalls) {
    a.toolCalls = a.toolCalls.filter(Boolean);
    for (const c of a.toolCalls) c.id ||= 'call_' + Math.random().toString(36).slice(2, 10);
  }
  const tEnd = performance.now();
  if (tFirst) {
    const n = usage?.completion_tokens ?? chunks;
    a.stats = {
      ttft: tFirst - t0,
      tps: n > 1 && tEnd > tFirst ? (n - 1) / ((tEnd - tFirst) / 1000) : null,
      tokens: n,
      approx: !usage,
      thinkMs: a.reasoning && tAnswer ? tAnswer - tFirst : null,
      prompt: usage?.prompt_tokens ?? null,
    };
    const cached = usage?.prompt_tokens_details?.cached_tokens;
    if (cached != null && usage.prompt_tokens) a.stats.cache = cached / usage.prompt_tokens;
    const m1 = m0 && await readMetrics();
    if (m1) {
      const d = k => (m1[k] ?? 0) - (m0[k] ?? 0);
      if (a.stats.cache == null && d('queries') > 0) a.stats.cache = d('hits') / d('queries');
      if (d('draftTokens') > 0) a.stats.accept = d('accepted') / d('draftTokens');
      if (d('drafts') > 0) a.stats.acceptLen = 1 + d('accepted') / d('drafts');
    }
  }
  return a;
}

async function runToolCalls(conv, a, signal) {
  for (const c of a.toolCalls) {
    c.running = true;
    if (conv === cur) renderLog();
    try {
      const tool = enabledTools().includes(c.name) && TOOLS[c.name];
      if (!tool) throw new Error(`unknown or disabled tool "${c.name}". Available tools: ${enabledTools().join(', ') || 'none'}.`);
      let args;
      try { args = c.args.trim() ? JSON.parse(c.args) : {}; }
      catch { throw new Error(`arguments are not valid JSON: ${c.args}`); }
      c.result = await tool.run(args, signal);
    } catch (e) {
      c.failed = true;
      c.result = e.name === 'AbortError' ? 'Error: cancelled by the user.' : `Error: ${e.message}`;
    }
    delete c.running;
    if (signal.aborted) break;
  }
}

// ---------- tools ----------
const clip = (s, n) => s.length > n ? s.slice(0, n) + `\n[… truncated, ${s.length - n} more characters]` : s;
const withTimeout = (signal, ms) => AbortSignal.any ? AbortSignal.any([signal, AbortSignal.timeout(ms)]) : signal;

function isPrivateHost(host) {
  const h = host.replace(/^\[|\]$/g, '').toLowerCase();
  if (h === 'localhost' || /\.(localhost|local|internal|lan|home\.arpa)$/.test(h)) return true;
  const v4 = h.match(/^(\d+)\.(\d+)\.\d+\.\d+$/);
  if (v4) {
    const a = +v4[1], b = +v4[2];
    return a === 0 || a === 10 || a === 127 || (a === 100 && b >= 64 && b < 128) || (a === 169 && b === 254) || (a === 172 && b >= 16 && b < 32) || (a === 192 && b === 168);
  }
  if (h.includes(':')) return h === '::' || h === '::1' || /^f[cd]/.test(h) || /^fe[89ab]/.test(h) || h.startsWith('::ffff:');
  return !h.includes('.'); // single-label names resolve on the local network
}

const FETCH_CHUNK = 6000; // ~1.5K tokens per call: small local contexts fill up fast
const pageCache = new Map(); // format+url -> text, so reading further with `start` doesn't refetch

function checkUrl(url) {
  let u;
  try { u = new URL(url); } catch { throw new Error(`invalid URL: ${url}`); }
  if (!/^https?:$/.test(u.protocol)) throw new Error('only http:// and https:// URLs are supported.');
  if (isPrivateHost(u.hostname)) throw new Error('localhost and private-network addresses are not allowed.');
  return u.href;
}

// Fetches a page through Jina Reader. Plain text is ~4x smaller than Markdown, which is mostly link URLs.
async function jinaRead(href, format, signal) {
  const key = format + ' ' + href;
  if (pageCache.has(key)) return pageCache.get(key);
  let res;
  try { res = await fetch('https://r.jina.ai/' + href, { signal: withTimeout(signal, 30000), headers: { DNT: '1', 'X-Return-Format': format, 'X-Retain-Images': 'none' } }); }
  catch (e) {
    if (e.name === 'AbortError') throw e;
    throw new Error(e.name === 'TimeoutError' ? 'Jina Reader timed out after 30 s.' : 'could not reach the Jina Reader service.');
  }
  const text = await res.text();
  if (res.status === 429) throw new Error('Jina Reader rate limit reached (about 20 requests per minute). Wait a minute before trying again.');
  if (!res.ok) throw new Error(`Jina Reader returned HTTP ${res.status}: ${text.slice(0, 300)}`);
  pageCache.set(key, text);
  return text;
}

async function readWebpage({ url, start, include_links }, signal) {
  const href = checkUrl(url);
  const body = await jinaRead(href, include_links ? 'markdown' : 'text', signal);
  start = Math.max(0, Math.floor(Number(start) || 0));
  const part = body.slice(start, start + FETCH_CHUNK), end = start + part.length;
  let foot = '';
  if (end < body.length) foot = `\n\n[Showing characters ${start}–${end} of ${body.length}. Call read_webpage with the same url and start=${end} to read more.]`;
  else if (start > 0) foot = `\n\n[End of page. Showed characters ${start}–${end} of ${body.length}.]`;
  return `URL: ${href}\n\n${part.trim() || '(empty page)'}${foot}`;
}

async function webSearch({ query }, signal) {
  if (typeof query !== 'string' || !query.trim()) throw new Error('`query` must be a non-empty string.');
  const q = query.trim();
  const text = await jinaRead('https://html.duckduckgo.com/html/?q=' + encodeURIComponent(q), 'text', signal);
  const k = text.indexOf('\nPast Year\n'); // results follow DuckDuckGo's region and date filter lists
  const results = (k >= 0 ? text.slice(k + 11) : text).replace(/\s*Feedback\s*$/, '').trim();
  return `Search results for "${q}". Each result: title, then address (domain/path), then snippet. Open one with read_webpage using https:// + the address.\n\n${clip(results || 'No results.', FETCH_CHUNK)}`;
}

// run_js executes in a Worker inside a sandboxed iframe. The iframe has an opaque origin (no access to this page,
// its localStorage/IndexedDB or cookies), and its CSP blocks all network access, which the worker inherits.
// Running in a worker keeps infinite loops off the page's thread; removing the iframe kills the worker.
function sandboxWorker() {
  const logs = [];
  const fmt = v => {
    if (typeof v === 'string') return v;
    try { const s = JSON.stringify(v, (k, x) => typeof x === 'bigint' ? `${x}n` : x, 2); return s === undefined ? String(v) : s; }
    catch { return String(v); }
  };
  for (const k of ['log', 'info', 'warn', 'error', 'debug']) console[k] = (...a) => logs.push(a.map(fmt).join(' '));
  onmessage = async e => {
    try {
      let value = (0, eval)(e.data);
      if (value && typeof value.then === 'function') value = await value;
      postMessage({ logs, value: value === undefined ? undefined : fmt(value) });
    } catch (err) {
      postMessage({ logs, error: err instanceof Error ? `${err.name}: ${err.message}` : fmt(err) });
    }
  };
}
function sandboxFrame(workerSrc) {
  onmessage = e => {
    const w = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: 'text/javascript' })));
    w.onmessage = m => parent.postMessage(m.data, '*');
    w.onerror = ev => { ev.preventDefault(); parent.postMessage({ logs: [], error: ev.message || 'Worker error' }, '*'); };
    w.postMessage(e.data);
  };
  parent.postMessage('ready', '*');
}
const SANDBOX_HTML = `<!doctype html><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; worker-src blob:"><script>(${sandboxFrame})(${JSON.stringify(`(${sandboxWorker})()`)})<\/script>`;
const JS_TIMEOUT = 5000;

function sandboxRun(code, signal) {
  return new Promise(resolve => {
    const frame = document.createElement('iframe');
    frame.sandbox = 'allow-scripts';
    frame.hidden = true;
    frame.srcdoc = SANDBOX_HTML;
    const timer = setTimeout(() => done({ logs: [], error: `Timed out after ${JS_TIMEOUT / 1000} s (infinite loop?). Execution was stopped.` }), JS_TIMEOUT);
    const onAbort = () => done({ logs: [], error: 'Cancelled by the user.' });
    function onMsg(e) {
      if (e.source !== frame.contentWindow) return;
      if (e.data === 'ready') frame.contentWindow.postMessage(code, '*');
      else done(e.data);
    }
    function done(r) {
      clearTimeout(timer);
      removeEventListener('message', onMsg);
      signal.removeEventListener('abort', onAbort);
      frame.remove();
      resolve(r);
    }
    addEventListener('message', onMsg);
    signal.addEventListener('abort', onAbort);
    document.body.append(frame);
  });
}

async function runJs({ code }, signal) {
  if (typeof code !== 'string' || !code.trim()) throw new Error('`code` must be a non-empty string.');
  const r = await sandboxRun(code, signal);
  const parts = [];
  if (r.logs?.length) parts.push('Console output:\n' + r.logs.join('\n'));
  if (r.error) parts.push('Error: ' + r.error + (/await/.test(r.error) ? ' (top-level await is not supported; end the code with an async IIFE, e.g. (async () => { … })(), and its promise will be awaited)' : ''));
  else parts.push('Result: ' + (r.value === undefined ? 'undefined' : r.value));
  return clip(parts.join('\n\n'), 4000);
}

// Context ring: the last request's prompt plus what it generated, against the model's context length.
function updateRing() {
  const ring = $('#ctxRing'), m = cur.messages.findLast(m => m.stats?.prompt != null), max = m && ctxLen[m.model];
  if (!max) { ring.hidden = true; return; }
  const used = m.stats.prompt + m.stats.tokens, f = Math.min(1, used / max);
  ring.hidden = false;
  ring.querySelector('.fill').style.strokeDashoffset = String(50.27 * (1 - f));

// One stats line per turn: TTFT of the first step; tokens, speed and acceptance across all steps.
function turnStats(msgs) {
  const last = msgs.at(-1), ss = msgs.map(m => m.stats).filter(Boolean);
  const head = [last.model, last.effort && `effort ${last.effort}`, msgs.length > 1 && `${msgs.length} steps`];
  if (!ss.length) return head.filter(Boolean).join(' · ');
  const A = ss.some(s => s.approx) ? '≈' : '';
  const tokens = ss.reduce((n, s) => n + s.tokens, 0);
  const timed = ss.filter(s => s.tps), decoded = timed.reduce((n, s) => n + s.tokens - 1, 0);
  const tps = timed.length ? decoded / timed.reduce((t, s) => t + (s.tokens - 1) / s.tps, 0) : null;
  const mean = (k, w) => { const xs = ss.filter(s => s[k] != null), W = xs.reduce((n, s) => n + w(s), 0); return xs.length && W ? xs.reduce((n, s) => n + s[k] * w(s), 0) / W : null; };
  const cache = mean('cache', () => 1), accept = mean('accept', s => s.tokens), acceptLen = mean('acceptLen', s => s.tokens);
  return [
    ...head,
    `TTFT ${(ss[0].ttft / 1000).toFixed(2)}s`,
    tps && `${A}${tps.toFixed(1)} tok/s`,
    `${A}${tokens} tokens`,
    cache != null && `cache ${Math.round(cache * 100)}%`,
    accept != null && `accept ${Math.round(accept * 100)}%` + (acceptLen ? ` (${acceptLen.toFixed(1)} tok/step)` : ''),
  ].filter(Boolean).join(' · ');
}

    openPop = { btn, menu };
  });
  menu.addEventListener('click', e => e.stopPropagation());
}
document.addEventListener('click', closePop);

function menuItem(label, hint, on, onClick) {
  const b = document.createElement('button');
  b.className = 'mi' + (on ? ' on' : '');
  b.innerHTML = `<span><b></b><small></small></span>${on ? icon('check') : ''}`;
  b.querySelector('b').textContent = label;
  b.querySelector('b').style.fontWeight = 'inherit';
  b.querySelector('small').textContent = hint || '';
  b.onclick = onClick;
  return b;
}

// Thinking effort. vLLM passes reasoning_effort to the chat template as-is, and templates accept different values
// (or none). There is no API listing them, so we render a prompt per value with /tokenize (no generation):
// values the template rejects are dropped, values that render the same prompt are merged, and the value whose
// prompt matches sending nothing is the default.
const EFFORT_LEVELS = ['none', 'minimal', 'low', 'medium', 'high', 'xhigh', 'max'];
const EFFORT_LABEL = { '': 'Default', none: 'Off', minimal: 'Minimal', low: 'Low', medium: 'Medium', high: 'High', xhigh: 'Extra high', max: 'Max' };
const effortStops = {}; // baseUrl|model -> [{ v, label, def }] (empty: no effort control), or a pending promise

async function probeEfforts(model) {
  const url = baseUrl().replace(/\/v1$/, '') + '/tokenize';
  const headers = { 'Content-Type': 'application/json', ...(settings.apiKey && { Authorization: 'Bearer ' + settings.apiKey }) };
  const render = async kwargs => {
    const res = await fetch(url, { method: 'POST', headers, signal: AbortSignal.timeout(10000), body: JSON.stringify({ model, messages: [{ role: 'user', content: 'hi' }], ...(kwargs && { chat_template_kwargs: kwargs }) }) });
    if (res.status === 404 || res.status === 405) throw new Error('no /tokenize');
    return res.ok ? (await res.json()).tokens.join(',') : null; // an error means the template rejected the value
  };
  try {
    const [base, ...prompts] = await Promise.all([render(null), ...EFFORT_LEVELS.map(v => render({ reasoning_effort: v, enable_thinking: v !== 'none' }))]);
    if (base == null) throw new Error('tokenize failed');
    const ok = EFFORT_LEVELS.map((v, i) => ({ v, p: prompts[i] })).filter(x => x.p != null);
    const off = ok.find(x => x.v === 'none'), seen = new Set(off ? [off.p] : []);
    const levels = ok.filter(x => x.v !== 'none' && !seen.has(x.p) && seen.add(x.p));
    let stops;
    if (levels.length > 1) stops = [...(off ? [off] : []), ...levels].map(x => ({ v: x.v, label: EFFORT_LABEL[x.v], def: x.p === base }));
    else if (off && levels.length) stops = [{ v: 'none', label: 'Off', def: off.p === base }, { v: levels[0].v, label: 'On', def: levels[0].p === base }]; // on/off only
    else return [];
    return stops.some(x => x.def) ? stops : [{ v: '', label: 'Default', def: true }, ...stops];
  } catch {
    // Not vLLM (or no /tokenize): offer the common OpenAI values; the server's default is unknown.
    return ['', 'none', 'low', 'medium', 'high'].map(v => ({ v, label: EFFORT_LABEL[v], def: v === '' }));
  }
}
async function effortsFor(model) {
  const key = baseUrl() + '|' + model;
  return effortStops[key] ??= probeEfforts(model).then(stops => effortStops[key] = stops);
}
const knownStops = model => Array.isArray(effortStops[baseUrl() + '|' + model]) ? effortStops[baseUrl() + '|' + model] : null;

// The effort to send for a model: the stored choice if the model supports it; nothing for its default.
function currentStop(model) {
  const stops = knownStops(model);
  if (!stops?.length) return null;
  const want = settings.efforts[model];
  return stops.find(s => s.v === want) ?? stops.find(s => s.def) ?? null;
}
function effortToSend(model) {
  const stop = currentStop(model);
  return stop && !stop.def ? stop.v : '';
}

const shortName = id => id.split('/').pop();
function syncModelChip() {
  const c = $('#modelChip'), stop = currentStop(settings.model);
  c.querySelector('.mname').textContent = settings.model ? shortName(settings.model) : 'No model';
  c.querySelector('.meff').textContent = stop ? stop.label : '';
  c.title = (settings.model || 'No model') + (stop ? ` · thinking: ${stop.label}` : '');
}
function renderEffort() {
  const stops = knownStops(settings.model), box = $('#effortBox'), range = $('#effortRange');
  box.hidden = !stops?.length;
  if (!stops?.length) return;
  const stop = currentStop(settings.model);
  range.max = stops.length - 1;
  range.value = stops.indexOf(stop);
  $('#effortVal').innerHTML = '';
  $('#effortVal').append(stop.label);
  if (stop.def) $('#effortVal').insertAdjacentHTML('beforeend', ' <small>(default)</small>');
  $('#effortTicks').replaceChildren(...stops.map(s => Object.assign(document.createElement('span'), { textContent: stops.length > 5 ? '·' : s.label })));
}
$('#effortRange').oninput = e => {
  const stop = knownStops(settings.model)[+e.target.value];
  settings.efforts = { ...settings.efforts, [settings.model]: stop.v };
  renderEffort();
  syncModelChip();
};
async function selectModel(id) {
  settings.model = id;
  setStatus(true, connText());
  syncModelChip();
  if (!cur.messages.length) renderLog();
  await effortsFor(id);
  if (settings.model === id) { syncModelChip(); renderEffort(); }
}
bindPop($('#modelChip'), $('#modelMenu'), () => {
  const list = $('#modelList');
  list.replaceChildren(...models.map(id => menuItem(shortName(id), ctxLen[id] ? `${fmtTok(ctxLen[id])}-token context` : '', id === settings.model, () => {
    selectModel(id);
    list.querySelectorAll('.mi').forEach(b => b.classList.remove('on'));
    closePop();
  })));
  if (!models.length) list.append(menuItem('No models', 'Check the connection in Settings', false, () => { closePop(); setPanel(true); }));
  renderEffort();
});

const toolsBtn = $('#toolsBtn');
function syncTools() {
  const n = enabledTools().length, total = Object.keys(TOOLS).length;
  toolsBtn.setAttribute('aria-pressed', String(!!settings.tools));
  toolsBtn.querySelector('span').textContent = settings.tools && n < total ? `Tools ${n}/${total}` : 'Tools';
  toolsBtn.title = settings.tools ? `Tools on: ${enabledTools().join(', ') || 'none enabled'} (choose in Settings)` : 'Tools off';
  $('#toolsMaster').checked = !!settings.tools;
  $('#toolList').classList.toggle('disabled', !settings.tools);
}
const setTools = on => { settings.tools = on; syncTools(); };
toolsBtn.onclick = () => setTools(!settings.tools);
$('#toolsMaster').onchange = e => setTools(e.target.checked);
$('#attach').onclick = () => $('#file').click();
$('#file').onchange = e => { addImages(e.target.files); e.target.value = ''; };
input.addEventListener('paste', e => {
  const files = [...e.clipboardData.files].filter(f => f.type.startsWith('image/'));
  if (files.length) { e.preventDefault(); addImages(files); }
});

// Drag & drop anywhere on the page. dragenter/dragleave fire for every child element, so count depth.
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
const endDrag = () => { dragDepth = 0; document.body.classList.remove('dragging'); };
addEventListener('dragenter', e => { if (hasFiles(e)) { dragDepth++; document.body.classList.add('dragging'); } });
addEventListener('dragleave', e => { if (hasFiles(e) && --dragDepth <= 0) endDrag(); });
addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  endDrag();
  addImages(e.dataTransfer.files);
  input.focus();
});

function syncJump() { const l = $('#log'); $('#jump').hidden = l.scrollHeight - l.scrollTop - l.clientHeight < 150; }
$('#log').addEventListener('scroll', syncJump);
$('#jump').onclick = () => $('#log').scrollTo({ top: $('#log').scrollHeight, behavior: 'smooth' });

// ---------- image viewer ----------
const viewer = $('#viewer');
viewer.onclick = () => viewer.close();
document.addEventListener('click', e => {
  const img = e.target.closest('.msg .imgs img, #atts img, .md img');
  if (!img || img.closest('a')) return;
  viewer.querySelector('img').src = img.src;
  viewer.showModal();
});
addEventListener('keydown', e => {
  if (e.key !== 'Escape' || viewer.open) return;
  if (openPop) closePop(); else controller?.abort();
});

$('#new').onclick = () => {
  controller?.abort();
  attachments = [];
  renderAtts();
  cur = { messages: [] };
  renderLog();
  input.focus();
};

// ---------- settings panel (changes apply immediately) ----------
const panel = $('#panel');
const setPanel = open => document.body.classList.toggle('panel-open', open);
$('#openSettings').onclick = () => setPanel(!document.body.classList.contains('panel-open'));
$('#closePanel').onclick = () => setPanel(false);
for (const el of panel.querySelectorAll('[data-key]')) {
  const k = el.dataset.key, trim = k === 'baseUrl' || k === 'apiKey';
  el.value = settings[k];
  el.addEventListener('input', () => { settings[k] = trim ? el.value.trim() : el.value; });
  if (trim) el.addEventListener('change', () => {
    if (!settings.baseUrl) el.value = settings.baseUrl = defaults.baseUrl;
    loadModels();
  });
}
$('#toolList').replaceChildren(...Object.entries(TOOLS).map(([name, t]) => {
  const row = document.createElement('div');
  row.className = 'trow';
  row.innerHTML = '<label><input type="checkbox"><span class="tname"></span></label><div class="tsum"></div><details><summary>What the model sees</summary><pre></pre></details>';
  const cb = row.querySelector('input');
  cb.checked = !settings.toolsOff.includes(name);
  cb.onchange = () => {
    settings.toolsOff = cb.checked ? settings.toolsOff.filter(n => n !== name) : [...settings.toolsOff, name];
    syncTools();
  };
  row.querySelector('.tname').textContent = name;
  row.querySelector('.tsum').textContent = t.summary;
  row.querySelector('pre').textContent = t.description + '\n\nParameters:\n' + JSON.stringify(t.parameters, null, 2);
  return row;
}));
syncTools();
syncModelChip();

// ---------- init ----------
applyTheme();
updateSend();
renderLog();
loadModels();
</script>
</body>
</html>
